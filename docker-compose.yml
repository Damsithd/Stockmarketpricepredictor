services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      # Tells Next.js where to proxy /api/* calls at build & runtime
      - BACKEND_URL=http://backend:8000
      - NODE_ENV=production

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
